[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Metadata ────────────────────────────────────────────────────

[project]
name = "platform-core"
version = "0.1.0"
description = "Motor de execução genérico de agentes. Carrega definições YAML, conecta ao LLM e executa ferramentas."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Seu Nome", email = "seu@email.com" }]
keywords = ["agents", "llm", "automation", "ollama"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# ── Dependências de runtime ────────────────────────────────────

dependencies = [
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "structlog>=24.0",
    "agent-sdk @ file:///${PROJECT_ROOT}/../agent-sdk",
]

# ── Dependências opcionais ─────────────────────────────────────

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "ipython>=8.0",
]

# ── Scripts / CLI ──────────────────────────────────────────────

[project.scripts]
platform = "platform_core.cli:app"

# ── Hatch (build) ──────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src/platform_core"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "pyproject.toml"]

# ── Ruff ───────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length já controlado pelo formatter
]

[tool.ruff.lint.isort]
known-first-party = ["platform_core", "agent_sdk"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Pytest ─────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--tb=short", "-q"]
markers = [
    "integration: testes que chamam APIs reais (necessitam credenciais)",
    "slow: testes demorados",
]

# ── Coverage ───────────────────────────────────────────────────

[tool.coverage.run]
source = ["src/platform_core"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
