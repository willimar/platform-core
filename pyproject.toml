[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-core"
version = "0.1.0"
description = "Motor de execução genérico de agentes. Carrega definições YAML, conecta ao LLM e executa ferramentas."
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.11"
authors = [{ name = "Seu Nome", email = "seu@email.com" }]
keywords = ["agents", "llm", "automation", "ollama"]

dependencies = [
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "structlog>=24.0",
    "agent-sdk",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "ipython>=8.0",
]

[project.scripts]
platform = "platform_core.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_core"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]
ignore = [
    "E501",
    "TC001",  # type-checking blocks pra imports de aplicação
    "TC003",  # type-checking blocks pra imports de stdlib
    "B008",   # function call in default argument (Typer precisa disso)
    "B904",   # raise from err (estilo, não funcional)
    "UP042",  # StrEnum (requer Python 3.11+, mas str+Enum funciona)
    "SIM105", # contextlib.suppress (estilo)
    "SIM115", # context manager for files (precisa refactor)
    "SIM117", # nested with statements (estilo)
    "RUF005", # iterable unpacking (estilo)
    "RUF013", # implicit Optional (requer mudar assinatura)
]

[tool.ruff.lint.isort]
known-first-party = ["platform_core", "agent_sdk"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--tb=short", "-q"]
markers = [
    "integration: testes que chamam APIs reais",
    "slow: testes demorados",
]

[tool.coverage.run]
source = ["src/platform_core"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70

[tool.uv.sources]
agent-sdk = { git = "https://github.com/willimar/agent-sdk.git" }
