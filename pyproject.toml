[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-core"
version = "0.1.0"
description = "Motor de execução genérico de agentes. Carrega definições YAML, conecta ao LLM e executa ferramentas."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Seu Nome", email = "seu@email.com" }]
keywords = ["agents", "llm", "automation", "ollama"]

dependencies = [
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "structlog>=24.0",
]

# ── Grupos de desenvolvimento (PEP 735) ────────────────────────

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "ipython>=8.0",
]

# ── Scripts / CLI ──────────────────────────────────────────────

[project.scripts]
platform = "platform_core.cli:app"

# ── Hatch (build) ──────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src/platform_core"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "pyproject.toml"]

# ── Ruff ───────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["platform_core", "agent_sdk"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Pytest ─────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--tb=short", "-q"]
markers = [
    "integration: testes que chamam APIs reais",
    "slow: testes demorados",
]

# ── Coverage ───────────────────────────────────────────────────

[tool.coverage.run]
source = ["src/platform_core"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
